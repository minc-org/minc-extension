name: e2e-tests-main

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      organization:
        default: 'minc-org'
        description: 'Organization of the Minc Extension repository'
        type: string
        required: true
      repositoryName:
        default: 'minc-extension'
        description: 'Minc Extension repository name'
        type: string
        required: true
      branch:
        default: 'main'
        description: 'Minc Extension repo branch'
        type: string
        required: true

jobs:
  e2e-tests:
    name: Run E2E tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout minc extension
      - uses: actions/checkout@v7
        name: Checkout Minc Extension (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ github.event.inputs.organization }}/${{ github.event.inputs.repositoryName }}
          ref: ${{ github.event.inputs.branch }}
          path: ${{ github.event.inputs.repositoryName }}

      - uses: actions/checkout@v7
        name: Checkout Minc Extension (Push)
        if: github.event_name == 'push'
        with:
          path: minc-extension

      # Checkout podman desktop
      - uses: actions/checkout@v7
        name: Checkout Podman Desktop
        with:
          repository: podman-desktop/podman-desktop
          ref: main
          path: podman-desktop

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
          package_json_file: ./podman-desktop/package.json

      - name: Force WSL Kernel Update
        if: matrix.os == 'windows-2022'
        shell: powershell
        run: |
          Write-Host "Checking for and installing latest WSL kernel update..."
          wsl --update

      # wsl --update can leave a background Windows Installer operation
      # (MSI) finishing up, which holds the global installer mutex and
      # makes the very next msiexec-based install (Podman) fail with
      # "Failed to grab execution mutex" / exit code 1618. Wait for the
      # mutex to be free before installing Podman. See #549.
      - name: Wait for Windows Installer to be idle
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            try {
              $mutex = [System.Threading.Mutex]::OpenExisting("Global\_MSIExecute")
              $mutex.Close()
              Write-Host "Windows Installer is busy, waiting 5s..."
              Start-Sleep -Seconds 5
            } catch [System.Threading.WaitHandleCannotBeOpenedException] {
              Write-Host "Windows Installer mutex is free."
              exit 0
            }
          }
          Write-Host "Timed out waiting for Windows Installer to become idle; proceeding anyway."

      # podman-install supports Linux/Windows only (no-op on macOS)
      - name: Update Podman
        if: matrix.os != 'macos-26'
        uses: redhat-actions/podman-install@main

      - name: Revert unprivileged user namespace restrictions in Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # allow unprivileged user namespace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Podman Desktop for E2E tests - Development Mode
        working-directory: ./podman-desktop
        run: |
          pnpm install
          pnpm test:e2e:build


      - name: Install Minc extension's dependencies
        working-directory: ./minc-extension
        run: pnpm install

      # macOS cannot pull the OCI image (no podman machine); preload like CRC e2e
      - name: Build and preload Minc extension locally (macOS)
        if: matrix.os == 'macos-26'
        working-directory: ./minc-extension
        run: |
          pnpm build
          mkdir -p tests/playwright/output/minc-tests-pd/plugins/extension
          cp -R package.json LICENSE icon.png README.md dist tests/playwright/output/minc-tests-pd/plugins/extension/

      - name: Run All E2E tests
        working-directory: ./minc-extension
        env:
          PODMAN_DESKTOP_ARGS: ${{ github.workspace }}/podman-desktop
          # Preloaded locally on mac (no podman machine to pull OCI image)
          SKIP_INSTALLATION: ${{ matrix.os == 'macos-26' && 'true' || '' }}
        run: pnpm test:e2e

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          annotate_only: true
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests: true
          report_paths: '**/*results.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-tests-${{ matrix.os }}
          path: |
            ./**/tests/**/output/
            ./**/tests/output/
